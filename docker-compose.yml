# =============================================================================
# ShieldAudit — self-contained deployment (offline SQLite)
#
# One container. No external database, no cloud. All audit data lives in the
# 'shieldaudit_data' Docker volume on this machine and never leaves it.
#
# Quick start:
#   docker compose up --build         (or run ./start.sh / .\start.ps1)
#   open http://localhost:3000
#
# Real AI autofill (optional): create a .env file with ANTHROPIC_API_KEY=sk-ant-...
# Without it, the app runs in mock mode (STORAGE_MODE=mock) with no API calls.
#
# Backup:  docker run --rm -v shieldaudit_data:/data -v ${PWD}:/out alpine tar czf /out/shieldaudit-backup.tar.gz -C /data .
# Wipe:    docker compose down -v     (WARNING: deletes all audit data)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shieldaudit:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/shieldaudit.db
      STORAGE_MODE: ${STORAGE_MODE:-mock}
      STRIPE_MODE: ${STRIPE_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Integrations (all optional — set in a .env file to enable)
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - shieldaudit_data:/data

volumes:
  shieldaudit_data:
    driver: local
